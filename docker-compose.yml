services:
  proxy:
    image: node:22-alpine
    command: ["node", "/app/server.js"]
    init: true
    user: node
    network_mode: host
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./server.js:/app/server.js:ro

  caddy:
    image: caddy:2-alpine
    network_mode: host
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
